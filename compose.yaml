name: viajando-com-o-dado-capitais

x-python: &python
  build:
    context: .
    dockerfile: Dockerfile
  image: viajando-com-o-dado-capitais-python:local
  init: true

x-database: &database
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${PGDATABASE:-viajando_com_o_dado}
  PGUSER: ${PGUSER:-postgres}
  PGPASSWORD: ${PGPASSWORD:?Preencha PGPASSWORD no arquivo .env}
  PGSSLMODE: disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Preencha PGPASSWORD no arquivo .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pipeline:
    <<: *python
    environment:
      <<: *database
      PYSPARK_PYTHON: /usr/local/bin/python
      VCD_TRACKING_ENABLED: "1"
    command: ["python", "-m", "pipeline.run_pipeline", "--year", "${PIPELINE_YEAR:-2025}", "--start-at", "${PIPELINE_START_AT:-consume}", "--stop-after", "load", "--schema", "${VCD_GOLD_SCHEMA:-gold}", "--if-needed"]
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: 1gb
    restart: "no"

  backend:
    <<: *python
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]
    environment:
      <<: *database
      VCD_DATA_DIRECTORY: /app/data
      VCD_GOLD_SCHEMA: ${VCD_GOLD_SCHEMA:-gold}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
