# O DNS interno do Docker atualiza o endereço após recriar o backend.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream application_backend {
    zone application_backend 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://application_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        # Revalida os arquivos para não manter uma interface antiga após atualizar a imagem.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
